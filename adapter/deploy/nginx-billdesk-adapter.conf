# Nginx Reverse Proxy snippet for BillDesk Static-IP Adapter
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/
# Requires a valid TLS certificate (e.g. Let's Encrypt certbot)

server {
    listen 443 ssl http2;
    server_name adapter.hakeemrestro.shop;  # Replace with approved HTTPS domain pointing to 64.225.85.27

    ssl_certificate /etc/letsencrypt/live/adapter.hakeemrestro.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adapter.hakeemrestro.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 5s;

    # Expose ONLY the two required UAT operations; reject everything else
    location = /uat/orders/create {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
    }

    location = /uat/transactions/get {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
    }

    # Deny all other routes
    location / {
        return 404;
    }
}
